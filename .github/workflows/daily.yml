name: Daily Stickman Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Bibliotheken installieren
        run: |
          pip install -r requirements.txt

      - name: Geschichte erstellen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Video erstellen
        run: python render.py

      - name: Dateien speichern
        uses: actions/upload-artifact@v4
        with:
          name: stickman-video
          path: output/
